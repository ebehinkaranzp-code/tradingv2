name: NeoWave engine checks
on:
  push:
    branches: [main]
    paths:
      - "engine/neowave_engine.cjs"
      - "engine/neowave_engine.test.cjs"
      - "research/NEOWAVE_SYSTEM_DESIGN.md"
      - ".github/workflows/neowave-engine-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test engine/neowave_engine.test.cjs
