name: Trading V2 full terminal build

concurrency:
  group: full-terminal-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "tradoor-source"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/dashboard-check.yml"
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "tradoor-source"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/dashboard-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN: "0.2.128"
  BINARYEN: version_132

jobs:
  verify:
    name: Verify complete analysis terminal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tradoor-source/signers/lighter/go.mod
          cache-dependency-path: tradoor-source/signers/lighter/go.sum

      - name: Install WASM tooling
        run: |
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN}/wasm-bindgen-${WASM_BINDGEN}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "wasm-bindgen-${WASM_BINDGEN}-x86_64-unknown-linux-musl/wasm-bindgen"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=2 "binaryen-${BINARYEN}/bin/wasm-opt"

      - name: Apply research-only safety profile
        run: python3 scripts/disable-live-trading.py tradoor-source/web

      - name: Install Quattro and TSMOM research engine
        run: python3 scripts/apply-research-engine.py tradoor-source/web web/analysis-legacy.html

      - name: Verify live-trading actions are unreachable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          web = Path("tradoor-source/web/src")
          model = (web / "workspace/model.ts").read_text()
          layout = (web / "workspace/Layout.tsx").read_text()
          settings = (web / "components/Settings.tsx").read_text()
          client = (web / "trade/client.ts").read_text()
          assert "'trade', 'positions'" not in model
          assert "const Trading = lazy" not in layout
          assert "TradingSettings" not in settings
          assert "LIVE_TRADING_DISABLED" in client
          assert "research" in model
          assert (web / "research/strategies.ts").is_file()
          assert (web / "panels/ResearchPanel.tsx").is_file()
          assert (web / "research/neo-wave.ts").is_file()
          assert (web / "research/strategies_test.ts").is_file()
          assert (web / "engine/intervals.test.ts").is_file()
          for action in ("t: 'order'", "t: 'cancel'", "t: 'move'", "t: 'leverage'", "t: 'flatten'", "t: 'algo'", "t: 'newAgent'", "t: 'importKey'"):
              assert action not in client, f"live action still wired: {action}"
          print("Research-only trading safety checks passed.")
          PY

      - name: Rust tests
        working-directory: tradoor-source
        run: cargo test --workspace --exclude tradoor-wasm --locked

      - name: Build browser engines
        working-directory: tradoor-source
        run: ./scripts/build-wasm.sh

      - name: Web dependencies
        working-directory: tradoor-source/web
        run: deno install

      - name: Web type check
        working-directory: tradoor-source/web
        run: deno task check

      - name: Web tests
        working-directory: tradoor-source/web
        run: deno task test

      - name: Build production web app
        working-directory: tradoor-source/web
        env:
          SITE_URL: https://ebehinkaranzp-code.github.io
        run: deno task build --base=/tradingv2/

      - name: Build complete server image
        run: docker build --tag tradingv2:ci .

  publish:
    name: Publish server image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
