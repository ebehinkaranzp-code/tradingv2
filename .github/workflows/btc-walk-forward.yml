name: BTC historical walk-forward research
on:
  push:
    branches: [main]
    paths:
      - "engine/research_btc.py"
      - "engine/test_research_btc.py"
      - "engine/download_binance_history.py"
      - ".github/workflows/btc-walk-forward.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download BTC daily candles since 2018
        run: python engine/download_binance_history.py --start 2018-01-01 --interval 1d --output data/BTCUSDT-1d.csv
      - name: Test model and train annual walk-forward models
        run: |
          python -m unittest engine/test_research_btc.py -v
          python engine/research_btc.py --data data/BTCUSDT-1d.csv --output research/results/btc-walk-forward.json
      - name: Publish report
        run: |
          python -c "import json,pathlib; x=json.loads(pathlib.Path('research/results/btc-walk-forward.json').read_text()); s=x['backtest']; lines=['# BTCUSDT Walk-forward Backtest','',f\"Data: {x['dataset']['first_utc']} to {x['dataset']['last_utc']} ({x['dataset']['candles']} candles)\",f\"Model accuracy: {x['classification']['accuracy_pct']:.2f}%\",f\"Strategy return: {s['return_pct']:.2f}%\",f\"Buy-and-hold return: {x['buy_hold_return_pct']:.2f}%\",f\"Max drawdown: {s['max_drawdown_pct']:.2f}%\",f\"Trades: {s['trades']}\",'','| Year | Train samples | Test samples | Accuracy | Brier |','|---:|---:|---:|---:|---:|']+[f\"| {r['year']} | {r['train_samples']} | {r['test_samples']} | {r['accuracy_pct']:.2f}% | {r['brier']:.4f} |\" for r in x['annual']]; pathlib.Path('research/results/btc-walk-forward.md').write_text('\\n'.join(lines)+'\\n')"
      - name: Archive raw data and detailed results
        uses: actions/upload-artifact@v4
        with:
          name: btc-walk-forward-data-and-results
          path: |
            data/BTCUSDT-1d.csv
            research/results/btc-walk-forward.json
          retention-days: 30
