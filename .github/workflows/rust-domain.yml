name: Rust domain core

on:
  push:
    branches:
      - work/rust-risk-core
    paths:
      - "rust/**"
      - ".github/workflows/rust-domain.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-domain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
