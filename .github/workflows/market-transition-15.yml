name: Market Transition Engine - 15 experiments
on:
  push:
    branches: [main]
    paths:
      - "engine/market_transition_research.py"
      - "engine/test_market_transition_research.py"
      - ".github/workflows/market-transition-15.yml"
      - "engine/download_binance_history.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: market-transition-15
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and anti-leakage tests
        run: python -m unittest engine/test_market_transition_research.py -v
      - name: Download current Binance Spot daily history
        run: python engine/download_binance_history.py --symbol BTCUSDT --start 2018-01-01 --interval 1d --output data/BTCUSDT-1d.csv
      - name: Run 15 experiments on daily and weekly bars
        run: python engine/market_transition_research.py --data data/BTCUSDT-1d.csv --output research/results/market-transition-15.json
      - name: Build readable summary
        run: |
          python - <<'PY'
          import json, pathlib
          x=json.loads(pathlib.Path("research/results/market-transition-15.json").read_text())
          lines=["# Market Transition Engine — 15 experiments","",
                 f"Symbol: {x['symbol']} | Venue: {x['venue']}","",
                 x["execution"],"", "The 15 configurations were fixed before evaluation. 2024+ is reported separately and was not used for tuning.",""]
          for tf in ("daily","weekly"):
              lines += [f"## {tf.title()} results","",
                        "| # | Experiment | OOS trades | Win rate | Return | Profit factor | Max DD |",
                        "|---:|---|---:|---:|---:|---:|---:|"]
              for r in x[tf]["experiments"]:
                  m=r["out_of_sample_2024_plus"]
                  wr="N/A" if m["win_rate_pct"] is None else f"{m['win_rate_pct']:.2f}%"
                  pf="N/A" if m["profit_factor"] is None else str(m["profit_factor"])
                  lines.append(f"| {r['experiment']['id']} | {r['experiment']['name']} | {m['trades']} | {wr} | {m['return_pct']:.2f}% | {pf} | {m['max_drawdown_pct']:.2f}% |")
              lines.append("")
          lines += ["## Research safeguards",""]+[f"- {s}" for s in x["anti_leakage"]]
          lines += ["",x["selection_warning"],""]
          pathlib.Path("research/results/market-transition-15.md").write_text("\n".join(lines))
          PY
      - name: Archive reproducible data and reports
        uses: actions/upload-artifact@v4
        with:
          name: market-transition-15-results
          path: |
            data/BTCUSDT-1d.csv
            research/results/market-transition-15.json
            research/results/market-transition-15.md
          retention-days: 90
