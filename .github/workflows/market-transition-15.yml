name: Market Transition Engine - TypeScript 35 experiments
on:
  push:
    branches: [main]
    paths:
      - "engine/market_transition_research.ts"
      - "engine/market_transition_research.test.cjs"
      - ".github/workflows/market-transition-15.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: market-transition-15
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TypeScript compiler
        run: npm install --no-save --no-package-lock typescript@5.8.3
      - name: Compile TypeScript
        run: npx tsc engine/market_transition_research.ts --target ES2022 --module commonjs --outDir dist --skipLibCheck --strict
      - name: Run Node.js tests
        run: node --test engine/market_transition_research.test.cjs
      - name: Download Binance Spot history and run 35 daily + weekly experiments
        run: node dist/market_transition_research.js --download --data data/BTCUSDT-1d.csv --output research/results/market-transition-35-node.json
      - name: Archive data and reports
        uses: actions/upload-artifact@v4
        with:
          name: market-transition-35-node-results
          path: |
            data/BTCUSDT-1d.csv
            research/results/market-transition-15-node.json
            research/results/market-transition-35-node.md
          retention-days: 90
