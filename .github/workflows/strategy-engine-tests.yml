name: Strategy engine regression tests

on:
  push:
    branches:
      - work/strategy-engine-port-main
    paths:
      - "services/strategy/legacy/**"
      - ".github/workflows/strategy-engine-tests.yml"
  pull_request:
    paths:
      - "services/strategy/legacy/**"
      - ".github/workflows/strategy-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run strategy regression tests
        working-directory: services/strategy/legacy
        run: node --test strategy-engine.test.cjs
