name: Trading V2 analysis and backtest tests

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/analysis-engine-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/analysis-engine-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax and tests
        run: |
          node --check engine/analysis-engine.js
          node --test engine/analysis-engine.test.cjs
      - name: Python backtest tests
        run: python -m unittest discover -s engine -p "test_*.py" -v
