name: Trading V2 analysis engine tests

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/analysis-engine-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/analysis-engine-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check engine/analysis-engine.js
      - name: Run analysis engine tests
        run: node --test engine/analysis-engine.test.cjs
